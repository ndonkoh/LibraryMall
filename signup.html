<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LibraryMall Sign Up</title>
<link rel="stylesheet" href="library.css">
<script src="js/theme.js"></script>
</head>
<body>

<div class="container">
  <h1 class="join">JOIN US TODAY !!</h1>

  <form onsubmit="handleSignup(event)">
    <div class="input-box">
      <input type="text" placeholder="Full name" required>
    </div>

    <div class="input-box">
      <input type="email" placeholder="Email Address" required>
    </div>

    <div class="input-box">
      <input type="password" placeholder="Password" required>
    </div>

    <div class="input-box">
      <input type="password" placeholder="Confirm password" required>
    </div>

    <button type="submit" class="login-btn">Create Account</button>
  </form>

  <p class="signin">
Already have an account? <a href="login.html" class="signin-link"><b>Log In</b></a>
</p>

  <p class="terms">
    By clicking “Continue”, I have read and agree with the
    <a href="terms.html"><b>Terms and Conditions</b></a>
  </p>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
