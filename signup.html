<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LibraryMall Sign Up</title>
<link rel="stylesheet" href="library.css">
</head>
<body>

<div class="container">
  <h1 class="join">JOIN US TODAY !!</h1>

  <label>User/Admin</label>

  <div class="input-box">
    <input type="text" placeholder="Admin">
  </div>

  <div class="input-box">
    <input type="text" placeholder="Identification Number">
  </div>

  <div class="input-box">
    <input type="text" placeholder="Full name">
  </div>

  <div class="input-box">
    <input type="email" placeholder="Email Address">
  </div>

  <div class="input-box">
    <input type="password" placeholder="Password">
  </div>

  <div class="input-box">
    <input type="password" placeholder="Confirm password">
  </div>

  <button class="login-btn">Create Account</button>

  <p class="signin">
Already have an account? <a href="login.html" class="signin-link"><b>Log In</b></a>
</p>

  <p class="terms">
    By clicking “Continue”, I have read and agree with the
    <a href="Terms and Conditions Applied"><b>Terms and Conditions Applied</b></a>
  </p>
</div>

</body>
</html>
