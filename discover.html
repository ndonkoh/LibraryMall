<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibraryMall Dashboard</title>
  <link rel="stylesheet" href="discover.css">
</head>
<body>

<div class="dashboard-container">

  <!-- Sidebar -->
  <div class="sidebar">
    <h2 class="logo">Library<span>Mall</span></h2>
    <ul class="menu">
      <li>Home</li>
      <li>Discover</li>
      <li>Bookmark</li>
      <li>Settings</li>
      <li>Help</li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">

    <!-- Search bar -->
    <div class="search-bar">
      <input type="text" placeholder="Search books...">
      <button>🔍</button>
    </div>

    <!-- Filter buttons -->
    <div class="filters">
      <button class="filter-btn">Popular</button>
      <button class="filter-btn">Top Selling</button>
      <button class="filter-btn active">Following</button>
      <button class="filter-btn">New</button>
    </div>

    <!-- Book List -->
    <div class="book-list">
      <div class="book-item"><span><img src="images\richman.png" alt="book" width="30px", height="30px"></span> The Richest Man in Babylon <button>→</button></div>
      <div class="book-item"><span><img src="images/thinkbook.png" alt="think" width="30px", height="30px"></span> Think And Grow Rich <button>→</button></div>
      <div class="book-item"><span><img src="images\fourth.png" alt="fourth" width="30px", height="30px"></span> Fourth Wing <button>→</button></div>
      <div class="book-item"><span><img src="images\twoincome.png" alt="two income" width="30px", height="30px"></span> The Two Income Trap <button>→</button></div>
      <div class="book-item"><span><img src="images\atomic.png" alt="atomic" width="30px", height="30px"></span> Atomic Habits <button>→</button></div>
      <div class="book-item"><span><img src="images\it.png" alt="it" width="30px", height="30px"></span> IT <button>→</button></div>
      <div class="book-item"><span><img src="images\mage.png" alt="mage" width="30px", height="30px"></span> The Mage <button>→</button></div>
      <div class="book-item"><span><img src="images\richdad.png" alt="rich dad" width="30px", height="30px"></span> Rich Dad Poor Dad <button>→</button></div>
      <div class="book-item"><span><img src="images\philosophy.png" alt="philosophy" width="30px", height="30px"></span> Philosophy Book for Beginners <button>→</button></div>
    </div>

  </div>

  <!-- Recommended Panel -->
  <div class="recommended">
    <div class="recommended-title">#1 RECOMMENDED</div>
    <img src="images\hoursbook.png" alt="4 Hour Work Week">
    <div class="recommended-name">4 Hour Work Week</div>
     <img src="images\powerofhabit.png" alt="The Power Of Habit">
    <div class="recommended-name">The Power Of Habit</div>
  </div>

</div>

</body>
</html>
