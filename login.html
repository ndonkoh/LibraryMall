<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LibraryMall Login</title>

<link rel="stylesheet" href="library.css">
<script src="js/theme.js"></script>
</head>

<body>

<div class="container">

<h3 class="welcome">WELCOME TO</h3>
<h1 class="title">LIBRARYMALL</h1>

<form onsubmit="handleLogin(event)">
<div class="input-box">
<input type="email" id="loginEmail" name="email" placeholder="Email Address" required>
</div>

<div class="input-box password-box">
<input type="password" placeholder="Password" id="password" name="password" required>
<span class="eye" onclick="togglePassword()">👁</span>
</div>

<p class="forgot">Forgot Password?</p>
<button type="submit" class="login-btn">Log In</button>
</form>

<div class="google-btn">
<img src="https://cdn-icons-png.flaticon.com/512/281/281764.png" width="20px", height="20px" alt="Google Icon">
<span>Continue with Google</span>
</div>

<p class="signup">Don’t have an account? <a href="signup.html" class="signup-link"><b>Sign Up</b></a></p>
</div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script></body>
</html>
